# JustUS Flutter - Advanced Static Analysis Configuration
# NOTE: This project requires unique filenames in /lib for the ImportUtils system.
# ==============================================================================

include: package:flutter_lints/flutter.yaml

analyzer:
  # Treat warnings as errors in CI — keeps the bar high.
  # Change to 'warning' locally if needed during refactor sprints.
  errors:
    # Architecture & coupling violations
    avoid_print: warning
    unused_import: error
    unused_local_variable: error
    dead_code: error
    # Type safety
    unnecessary_nullable_for_final_variable_declarations: warning
    cast_nullable_to_non_nullable: error
    unnecessary_cast: warning
    # Async patterns
    unawaited_futures: error
    avoid_void_async: warning
    discarded_futures: warning

  language:
    strict-casts: true
    strict-raw-types: true

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/all_imports.dart"
    - "tool/**"
    - "build/**"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**

linter:
  rules:
    # ── CORE: always-on Flutter lints ──────────────────────────────────────────
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    use_key_in_widget_constructors: true

    # ── WIDGET ARCHITECTURE: prevent spaghetti widgets ─────────────────────────
    # Force all large build() trees to be broken into sub-widgets or methods.
    avoid_unnecessary_containers: true
    sized_box_for_whitespace: true
    sized_box_shrink_expand: true
    use_decorated_box: true

    # ── CODE STYLE & CONSISTENCY ───────────────────────────────────────────────
    avoid_print: true
    avoid_empty_else: true
    avoid_redundant_argument_values: true
    avoid_returning_null_for_void: true
    avoid_slow_async_io: true
    avoid_type_to_string: true
    avoid_unused_constructor_parameters: true
    avoid_void_async: true
    cancel_subscriptions: true
    close_sinks: true
    literal_only_boolean_expressions: true
    no_logic_in_create_state: true
    prefer_void_to_null: true
    throw_in_finally: true
    unnecessary_statements: true
    use_build_context_synchronously: true

    # ── NULL SAFETY ────────────────────────────────────────────────────────────
    null_check_on_nullable_type_parameter: true
    prefer_null_aware_operators: true
    unnecessary_null_aware_assignments: true
    unnecessary_null_checks: true
    unnecessary_nullable_for_final_variable_declarations: true

    # ── ASYNC PATTERNS ─────────────────────────────────────────────────────────
    unawaited_futures: true
    discarded_futures: true

    # ── PERFORMANCE ────────────────────────────────────────────────────────────
    avoid_function_literals_in_foreach_calls: true
    prefer_for_elements_to_map_fromIterable: true
    prefer_spread_collections: true
    use_if_null_to_convert_nulls_to_bools: true

    # ── IMPORTS & STRUCTURE (NOT APPLICABLE DUE TO ALL_IMPORTS) ────────────────────────────────────────────────────
    directives_ordering: false
    implementation_imports: false
    prefer_relative_imports: false

    # ── NAMING ────────────────────────────────────────────────────────────────
    camel_case_extensions: true
    camel_case_types: true
    constant_identifier_names: true
    file_names: true
    library_names: true
    non_constant_identifier_names: true

    # ── DOCUMENTATION (warn, not error) ───────────────────────────────────────
    # Require docs on public APIs to reduce "guess what this does" overhead.
    public_member_api_docs: false   # set to true when team is ready
    package_api_docs: false

    # Intentionally OFF — these conflict with the VP design system patterns:
    # avoid_positional_boolean_parameters: false  (VPButton uses isLoading bool)