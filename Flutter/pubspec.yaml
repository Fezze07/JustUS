name: justus
description: A private couples app for sharing emotions, media, and interactive games.
publish_to: 'none'
version: 1.3.6+18

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State management
  provider: ^6.1.1

  # Supabase - direct client for all data CRUD
  supabase_flutter: ^2.8.4

  # Networking
  http: ^1.6.0

  # Local storage
  shared_preferences: ^2.5.4

  # Image handling
  image_picker: ^1.1.2
  cached_network_image: ^3.4.0
  flutter_cache_manager: ^3.4.0
  flutter_image_compress: ^2.3.0
  video_compress: ^3.1.2

  # Video/Audio playback
  video_player: ^2.8.2
  audioplayers: ^6.5.1

  # File handling
  path_provider: ^2.1.2

  # Utilities
  package_info_plus: ^10.1.0
  url_launcher: ^6.2.4
  flutter_local_notifications: ^21.0.0
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  uuid: ^4.3.3
  crypto: ^3.0.6

  # UI
  google_fonts: ^8.0.1
  flutter_dotenv: ^6.0.1
  flutter_secure_storage: ^10.0.0
  logger: ^2.7.0
  cloudflare_turnstile: ^3.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.3
  flutter_launcher_icons: ^0.13.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "F:/JustUS/JustUs.png"
  web:
    generate: true
    image_path: "F:/JustUS/JustUs.png"
  windows:
    generate: true
    image_path: "F:/JustUS/JustUs.png"
  linux:
    generate: true
    image_path: "F:/JustUS/JustUs.png"

dependency_overrides:
  flutter_inappwebview_android: 1.1.3
